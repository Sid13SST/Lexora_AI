version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lexora_postgres
    environment:
      POSTGRES_USER: lexora
      POSTGRES_PASSWORD: lexorapassword
      POSTGRES_DB: lexora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexora_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
